<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Wanderlust</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 4rem;
            color: #f97316;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.8rem;
            color: #1f2937;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #0f766e;
            color: white;
            padding: 13px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0d5d57;
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Page not found</h2>
        <p>
            Sorry, the page you're looking for doesn't exist. 
            This destination is off the map! Let's get you back on track.
        </p>
        <a href="/" class="btn">Return to Home</a>
    </div>
</body>
</html>
